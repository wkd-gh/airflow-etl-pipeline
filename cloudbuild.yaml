steps:
  # 1. Fetch git history (shallow clone 대비)
  - name: 'gcr.io/cloud-builders/git'
    id: 'git-fetch'
    args:
      - 'fetch'
      - '--depth=2'
      - 'origin'
      - 'main'

  # 2. SSH key setup
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'setup-ssh'
    waitFor: ['git-fetch']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        mkdir -p /root/.ssh
        echo "$$SSH_PRIVATE_KEY" > /root/.ssh/id_rsa
        chmod 600 /root/.ssh/id_rsa
        ssh-keyscan -H 34.50.49.51 >> /root/.ssh/known_hosts
        chmod 600 /root/.ssh/known_hosts
    secretEnv:
      - 'SSH_PRIVATE_KEY'
    volumes:
      - name: 'ssh'
        path: /root/.ssh

  # 3. 변경 파일 감지 후 분기 배포
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy'
    waitFor: ['setup-ssh']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null \
          || git diff --name-only $(git rev-list --max-parents=0 HEAD) HEAD)

        echo "===== Changed Files ====="
        echo "$$CHANGED_FILES"
        echo "========================="

        DOCKER_CHANGED=$(echo "$$CHANGED_FILES" \
          | grep -E "(Dockerfile|docker-compose\.ya?ml|requirements.*\.txt)" || true)

        if [ -n "$$DOCKER_CHANGED" ]; then
          echo "[Docker] git pull + docker compose up -d --build"
          SSH_SCRIPT='set -e
        cd ~/airflow-etl-pipeline
        [ -d dags ]    && sudo chown -R $(id -un):$(id -un) dags/    || true
        [ -d include ] && sudo chown -R $(id -un):$(id -un) include/ || true
        git pull origin main
        docker compose up -d --build
        echo "Docker rebuild done"'
          ssh -i /root/.ssh/id_rsa \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              moneydigger777@34.50.49.51 "$$SSH_SCRIPT"
        else
          echo "[Code] git pull only"
          SSH_SCRIPT='set -e
        cd ~/airflow-etl-pipeline
        [ -d dags ]    && sudo chown -R $(id -un):$(id -un) dags/    || true
        [ -d include ] && sudo chown -R $(id -un):$(id -un) include/ || true
        git pull origin main
        echo "Code sync done"'
          ssh -i /root/.ssh/id_rsa \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              moneydigger777@34.50.49.51 "$$SSH_SCRIPT"
        fi
    volumes:
      - name: 'ssh'
        path: /root/.ssh

  # 4. Slack success notification
  - name: 'gcr.io/cloud-builders/curl'
    id: 'notify-success'
    waitFor: ['deploy']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null \
          || git diff --name-only $(git rev-list --max-parents=0 HEAD) HEAD)
        DOCKER_CHANGED=$(echo "$CHANGED_FILES" \
          | grep -E "(Dockerfile|docker-compose\.ya?ml|requirements.*\.txt)" || true)
 
        if [ -n "$DOCKER_CHANGED" ]; then
          DEPLOY_TYPE=":docker: Docker rebuild + deploy"
        else
          DEPLOY_TYPE=":file: Code sync (git pull only)"
        fi
 
        LOG_URL="https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=equity-derivative-etl"
        REPO_URL="https://github.com/Money-Digger/airflow-etl-pipeline/commit/$COMMIT_SHA"
 
        curl -s -X POST -H 'Content-type: application/json' \
          --data "{
            \"attachments\": [{
              \"color\": \"#36a64f\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \":check_custom: *airflow-etl-pipeline deployed successfully*\"
                  }
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*Branch*\n$BRANCH_NAME\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Commit*\n<$REPO_URL|$SHORT_SHA>\"}
                  ]
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*Deploy Type*\n$DEPLOY_TYPE\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Repository*\n<https://github.com/Money-Digger/airflow-etl-pipeline|Money-Digger/airflow-etl-pipeline>\"}
                  ]
                },
                {
                  \"type\": \"actions\",
                  \"elements\": [
                    {
                      \"type\": \"button\",
                      \"text\": {\"type\": \"plain_text\", \"text\": \"View Build Logs :cloudbuild:\", \"emoji\": true},
                      \"url\": \"$LOG_URL\"
                    }
                  ]
                },
                {
                  \"type\": \"context\",
                  \"elements\": [
                    {\"type\": \"mrkdwn\", \"text\": \"$(date '+%Y-%m-%d %H:%M:%S') KST\"}
                  ]
                }
              ]
            }]
          }" \
          "$$CLOUD_BUILD_SLACK_WEBHOOK_URL"
    secretEnv:
      - 'CLOUD_BUILD_SLACK_WEBHOOK_URL'

availableSecrets:
  secretManager:
    - versionName: projects/equity-derivative-etl/secrets/CLOUD_BUILD_SSH_PRIVATE_KEY/versions/latest
      env: 'SSH_PRIVATE_KEY'
    - versionName: projects/equity-derivative-etl/secrets/CLOUD_BUILD_SLACK_WEBHOOK_URL/versions/latest
      env: 'CLOUD_BUILD_SLACK_WEBHOOK_URL'

options:
  logging: CLOUD_LOGGING_ONLY