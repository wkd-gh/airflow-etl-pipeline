steps:
  # 1. Fetch git history (shallow clone 대비)
  - name: 'gcr.io/cloud-builders/git'
    id: 'git-fetch'
    args:
      - 'fetch'
      - '--depth=2'
      - 'origin'
      - 'main'

  # 2. SSH key setup
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'setup-ssh'
    waitFor: ['git-fetch']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        mkdir -p /root/.ssh
        echo "$$SSH_PRIVATE_KEY" > /root/.ssh/id_rsa
        chmod 600 /root/.ssh/id_rsa
        ssh-keyscan -H 34.50.49.51 >> /root/.ssh/known_hosts
        chmod 600 /root/.ssh/known_hosts
    secretEnv:
      - 'SSH_PRIVATE_KEY'
    volumes:
      - name: 'ssh'
        path: /root/.ssh

  # 3. 변경 파일 감지 후 분기 배포
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy'
    waitFor: ['setup-ssh']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null \
          || git diff --name-only $(git rev-list --max-parents=0 HEAD) HEAD)

        echo "===== Changed Files ====="
        echo "$$CHANGED_FILES"
        echo "========================="

        DOCKER_CHANGED=$(echo "$$CHANGED_FILES" \
          | grep -E "(Dockerfile|docker-compose\.ya?ml|requirements.*\.txt)" || true)

        if [ -n "$$DOCKER_CHANGED" ]; then
          echo "[Docker] git pull + docker compose up -d --build"
          SSH_SCRIPT='set -e
        cd ~/airflow-etl-pipeline
        [ -d dags ]    && sudo chown -R $(id -un):$(id -un) dags/    || true
        [ -d include ] && sudo chown -R $(id -un):$(id -un) include/ || true
        git pull origin main
        docker compose up -d --build
        echo "Docker rebuild done"'
          ssh -i /root/.ssh/id_rsa \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              moneydigger777@34.50.49.51 "$$SSH_SCRIPT"
        else
          echo "[Code] git pull only"
          SSH_SCRIPT='set -e
        cd ~/airflow-etl-pipeline
        [ -d dags ]    && sudo chown -R $(id -un):$(id -un) dags/    || true
        [ -d include ] && sudo chown -R $(id -un):$(id -un) include/ || true
        git pull origin main
        echo "Code sync done"'
          ssh -i /root/.ssh/id_rsa \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              moneydigger777@34.50.49.51 "$$SSH_SCRIPT"
        fi
    volumes:
      - name: 'ssh'
        path: /root/.ssh

  # 4. Slack success notification
  - name: 'gcr.io/cloud-builders/curl'
    id: 'notify-success'
    waitFor: ['deploy']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null \
          || git diff --name-only $(git rev-list --max-parents=0 HEAD) HEAD)
        DOCKER_CHANGED=$(echo "$$CHANGED_FILES" \
          | grep -E "(Dockerfile|docker-compose\.ya?ml|requirements.*\.txt)" || true)

        if [ -n "$$DOCKER_CHANGED" ]; then
          DEPLOY_TYPE="Docker rebuild + deploy"
        else
          DEPLOY_TYPE="Code sync (git pull only)"
        fi

        curl -s -X POST -H 'Content-type: application/json' \
          --data "{
            \"attachments\": [{
              \"color\": \"#36a64f\",
              \"title\": \"[SUCCESS] airflow-etl-pipeline deployed\",
              \"fields\": [
                {\"title\": \"Branch\",       \"value\": \"$BRANCH_NAME\", \"short\": true},
                {\"title\": \"Commit\",       \"value\": \"$SHORT_SHA\",   \"short\": true},
                {\"title\": \"Deploy Type\",  \"value\": \"$$DEPLOY_TYPE\", \"short\": false}
              ],
              \"footer\": \"Google Cloud Build\",
              \"ts\": $(date +%s)
            }]
          }" \
          "$$CLOUD_BUILD_SLACK_WEBHOOK_URL"
    secretEnv:
      - 'CLOUD_BUILD_SLACK_WEBHOOK_URL'

availableSecrets:
  secretManager:
    - versionName: projects/equity-derivative-etl/secrets/CLOUD_BUILD_SSH_PRIVATE_KEY/versions/latest
      env: 'SSH_PRIVATE_KEY'
    - versionName: projects/equity-derivative-etl/secrets/CLOUD_BUILD_SLACK_WEBHOOK_URL/versions/latest
      env: 'CLOUD_BUILD_SLACK_WEBHOOK_URL'

options:
  logging: CLOUD_LOGGING_ONLY